name: okkhor

services:
  postgres:
    image: postgres:17-alpine
    container_name: okkhor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: okkhor
    ports:
      - "5432:5432"
    volumes:
      - okkhor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okkhor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: okkhor-redis
    restart: unless-stopped
    # Cache and ephemeral state only (ADR-005): persistence stays disabled so nothing
    # durable can quietly come to rely on this instance.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  okkhor-postgres-data:
