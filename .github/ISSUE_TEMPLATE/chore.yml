name: Chore
description: Track maintenance work such as dependency updates, refactors, cleanup, or documentation hygiene.
title: "[Chore]: "
labels:
  - "type: chore"
body:
  - type: textarea
    id: task
    attributes:
      label: Task description
      description: Describe the maintenance work clearly and concretely.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that define completion.
      placeholder: |
        - Dependency versions are updated
        - CI passes
        - Documentation is refreshed
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort estimate
      description: Provide a rough implementation estimate.
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true
