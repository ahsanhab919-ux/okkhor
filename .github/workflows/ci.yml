name: CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-standards:
    name: repository-standards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository standards files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "ENGINEERING_HANDBOOK.md"
            "CONTRIBUTING.md"
            ".github/pull_request_template.md"
            ".github/CODEOWNERS"
            ".github/workflows/ci.yml"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/chore.yml"
            ".github/ISSUE_TEMPLATE/config.yml"
            ".github/ISSUE_TEMPLATE/documentation_update.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
            ".github/ISSUE_TEMPLATE/incident_report.yml"
            ".github/ISSUE_TEMPLATE/operational_task.yml"
            "docs/standards/BRANCH_PROTECTION_RULES.md"
            "package.json"
            "package-lock.json"
            "tsconfig.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required repository file: $file"
              exit 1
            fi
          done

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-standards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-standards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm run test:ci

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - static-analysis
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-standards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high
